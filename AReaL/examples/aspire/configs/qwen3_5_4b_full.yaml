experiment_name: aspire-qwen3-5-4b-grpo
trial_name: full-parameter-dry-v1
seed: 1
enable_offload: false
total_train_epochs: 1
tokenizer_path: ${actor.path}

broker_url: ${oc.env:ASPIRE_BROKER_URL}
broker_admin_token_env: ASPIRE_BROKER_ADMIN_TOKEN
protocol_version: aspire-online-rl/v1

cluster:
  n_nodes: 1
  n_gpus_per_node: 6
  fileroot: ${oc.env:AREAL_EXPERIMENT_ROOT}
  name_resolve:
    type: nfs
    nfs_record_root: ${oc.env:AREAL_NAME_RESOLVE_ROOT}

scheduler:
  type: local

rollout:
  _version: v2
  backend: sglang:d1p1t2
  admin_api_key: ${oc.env:AREAL_ADMIN_API_KEY}
  use_lora: false
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  max_concurrent_rollouts: 4
  queue_size: 4
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 0
  workers_ready_timeout: 120
  enable_rollout_tracing: false
  dump_to_file: false
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 2
      mem: 64
      cmd: python3 -m areal.infra.rpc.rpc_server
  agent:
    agent_cls_path: examples.aspire.agent.AspireActor
    mode: inline
    tool_call_parser: qwen3_coder
    reasoning_parser: qwen3
    chat_template_type: hf
    engine_max_tokens: 131072
    export_style: individual
    turn_discount: 1.0
    session_timeout_seconds: 18000
    drop_retry_orphans: false

gconfig:
  n_samples: 4
  min_new_tokens: 0
  max_new_tokens: 4096
  max_tokens: 131072
  greedy: false
  temperature: 1.0
  seed: null
  reward_normalization: true
  drop_incomplete_group: false

actor:
  _version: v2
  backend: fsdp:d4p1t1
  admin_api_key: ${oc.env:AREAL_ADMIN_API_KEY}
  request_timeout: 7200
  workers_ready_timeout: 120
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${oc.env:ASPIRE_ACTOR_MODEL_PATH}
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  use_lora: false
  attn_impl: flash_attention_2
  mb_spec:
    max_tokens_per_mb: 131072
  fsdp:
    memory_efficient_load: true
    selective_loss_logits: true
  optimizer:
    type: adam
    lr: 1.0e-6
    weight_decay: 0.01
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  loss_reduction: episode_mean
  eps_clip: 0.2
  temperature: ${gconfig.temperature}
  reward_scaling: 1.0
  reward_bias: 0.0
  kl_ctl: 0.0
  discount: 1.0
  gae_lambda: 1.0
  mask_no_eos_with_zero: false
  ppo_n_minibatches: 1
  recompute_logprob: false
  use_decoupled_loss: false
  rejection_sampling: null
  reward_norm: null
  adv_norm: null
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      mem: 64
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars:
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

ref: null
critic: null
teacher: null

sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: true
  dtype: ${actor.dtype}
  max_running_requests: 4
  context_length: 131072
  mem_fraction_static: 0.8
  enable_multimodal: true
  disable_custom_all_reduce: true

train_dataset:
  batch_size: 1
  shuffle: true
  pin_memory: false
  num_workers: 0
  path: ${oc.env:ASPIRE_CAMPAIGN_MANIFEST}
  type: rl
  scheduling_spec: null

valid_dataset: null

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: 3600

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled

perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false
